server {
    listen       8080;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    server_tokens off;

    gzip on;
    # Both JavaScript media types are listed on purpose. nginx 1.27 still maps
    # .js to `application/javascript`, but the default is moving to
    # `text/javascript`; listing only one of them is a silent "the main bundle
    # stopped being compressed" waiting for a base-image bump.
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml;
    gzip_min_length 1024;
    gzip_vary on;

    # Fingerprinted assets are immutable; the entry HTML never is.
    location /assets/ {
        include /etc/nginx/conf.d/security-headers.inc;
        # One directive, not `expires 1y` *plus* an add_header: those emit two
        # separate Cache-Control lines (and a legacy Expires) and leave it to
        # the client which one wins.
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location = /index.html {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-cache" always;
    }

    location = /healthz {
        access_log off;
        add_header Content-Type "text/plain" always;
        return 200 "ok\n";
    }

    location / {
        include /etc/nginx/conf.d/security-headers.inc;
        try_files $uri $uri/ /index.html;
    }
}
